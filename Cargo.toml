[package]
name = "tts-bot"
version = "0.1.0"
edition = "2024"
default-run = "tts-bot"

[dependencies]
# Confirmados con soporte DAVE (ver ../bot-go/plan-go-rust.md, sección "Selección de crates"):
# songbird 0.6.0 (2026-04-05) fue la primera versión en soportar el protocolo DAVE
# (depende de la nueva crate `davey ^0.1.2`, publicada el 2026-03-02 — el día que
# Discord lo hizo obligatorio). Requiere serenity ^0.12.0.
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "voice", "rustls_backend", "cache"] }
songbird = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Capa de datos (fase 2): redb en vez de bindings a LevelDB en C — ver
# src/data/mod.rs para la justificación. serde/serde_json codifican los valores
# igual que `encoding/json` en Go; thiserror evita boilerplate de `impl Error`.
redb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
symphonia = { version = "0.5.5", features = ["mp3"] }


[dev-dependencies]
tempfile = "3"
mockito = "1.4"

